name: Offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: offline-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B sim/verify_repository.py
      - run: python -B sim/run_gesture_tests.py
      - run: python -B sim/test_eye_presence.py -v
      - run: python -B skill/pynq-eye-system/tests/test_project.py
      - run: python -B -m unittest discover -s sim/tools -v

      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
      - run: npx playwright install --with-deps chromium
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
      - run: npm run test:ui
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
