# CH9329 on Pmod A1 (TX) / A2 (RX), shared FPGA UARTLite.
# The bitstream fixes baud and clock: do not tune FCLK at runtime.
[Service]
ExecStart=
ExecStart=/usr/local/share/pynq-venv/bin/python3 -u /home/xilinx/ch9329_hid/hid_bridge.py --api http://192.168.2.99:8080/api/state --transport uartlite --base 0x41200000 --baud 9600 --clock-hz 62500000 --require-report --max-age 6.0 --status-file /home/xilinx/ch9329_hid/logs/status.json --log-dir /home/xilinx/ch9329_hid/logs
